
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
content="black-translucent">

<meta name="theme-color" content="#c8c8cc">

<title>iClone Music</title>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --pod: #c8c8cc;
  --wheel: #fafafa;
  --icons: #858585;
}

html, body {
  margin: 0;
  min-height: 100%;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  min-height: 100dvh;
  background: #111;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 18px;
}

button, input, select {
  font: inherit;
}

button {
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
}

.ipod {
  width: min(100%, 380px);
  padding: 18px;
  background: var(--pod);
  border-radius: 30px;
  box-shadow:
    inset 0 2px 5px #ffffff88,
    inset 0 -3px 5px #00000020,
    0 15px 50px #00000070;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

body.full {
  padding: 0;
  background: var(--pod);
}

body.full .ipod {
  width: 100%;
  min-height: 100dvh;
  border-radius: 0;
  box-shadow: none;
  padding:
    max(18px, env(safe-area-inset-top))
    max(16px, env(safe-area-inset-right))
    max(18px, env(safe-area-inset-bottom))
    max(16px, env(safe-area-inset-left));
}

body.full .screen-frame {
  width: 100%;
  max-width: 650px;
  margin: 0 auto;
}

body.full .screen {
  height: clamp(330px, 49dvh, 550px);
}

.screen-frame {
  padding: 8px;
  border-radius: 12px;
  background: #222;
}

.screen {
  height: 330px;
  background: white;
  border-radius: 4px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  color: #111;
}

.status {
  height: 28px;
  flex-shrink: 0;
  display: grid;
  grid-template-columns: 24px 1fr 24px;
  align-items: center;
  padding: 0 8px;
  background: linear-gradient(#fff,#c0cbd4);
  border-bottom: 1px solid #999;
  font-size: 13px;
  font-weight: bold;
}

.status button {
  border: 0;
  background: none;
  color: #333;
  padding: 0;
  display: grid;
  place-items: center;
}

.status button svg {
  width: 12px;
  height: 12px;
}

#header {
  text-align: center;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.battery {
  width: 21px;
  height: 10px;
  border: 1px solid #555;
  border-radius: 2px;
  padding: 1px;
  position: relative;
}

.battery::before {
  content: "";
  display: block;
  width: 85%;
  height: 100%;
  background: linear-gradient(#a9e678,#3a9c30);
}

.battery::after {
  content: "";
  position: absolute;
  right: -3px;
  top: 2px;
  width: 2px;
  height: 4px;
  background: #555;
}

#content {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
}

.menu-row {
  width: 100%;
  min-height: 36px;
  padding: 9px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  background: white;
  border: 0;
  color: #111;
  font-size: 15px;
  font-weight: bold;
  text-align: left;
}

.menu-row.active {
  color: white;
  background: linear-gradient(#62b8fa,#1178d4);
}

.menu-row span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.menu-row svg {
  width: 9px;
  height: 13px;
  flex-shrink: 0;
}

/* CLICK WHEEL */

.wheel {
  width: min(84%,290px);
  aspect-ratio: 1;
  margin: 28px auto 14px;
  position: relative;
  border-radius: 50%;
  background: var(--wheel);
  box-shadow: 0 1px 3px #00000025;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  flex-shrink: 0;
}

.wheel button {
  position: absolute;
  transform: translate(-50%,-50%);
  display: flex;
  align-items: center;
  justify-content: center;
  border: 0;
  background: none;
  padding: 0;
  margin: 0;
  color: var(--icons);
  touch-action: none;
}

.wheel button svg {
  width: 22px;
  height: 22px;
  display: block;
  pointer-events: none;
}

.menu-key {
  left: 50%;
  top: 16%;
  width: 30%;
  height: 23%;
  font-size: 13px;
  font-weight: bold;
}

.prev-key {
  left: 16%;
  top: 50%;
  width: 23%;
  height: 30%;
}

.next-key {
  left: 84%;
  top: 50%;
  width: 23%;
  height: 30%;
}

.play-key {
  left: 50%;
  top: 84%;
  width: 30%;
  height: 23%;
}

.wheel .play-key svg {
  width: 26px;
}

.wheel .center-key {
  left: 50%;
  top: 50%;
  width: 36%;
  height: 36%;
  border-radius: 50%;
  background: var(--pod);
  border: 1px solid #00000015;
  box-shadow: inset 0 1px 3px #ffffff66;
  z-index: 2;
}

.wheel button:active {
  opacity: .65;
}

.wheel .center-key:active {
  box-shadow: inset 0 2px 6px #00000030;
}

body.full .wheel {
  width: min(80vw,37dvh,340px);
  margin: 24px auto;
}

/* INPUTS */

.panel {
  padding: 12px;
  font-size: 13px;
}

.panel h3 {
  margin: 0 0 12px;
}

input:not([type=range]), select {
  width: 100%;
  padding: 10px;
  margin-bottom: 8px;
  border: 1px solid #aaa;
  border-radius: 5px;
  font-size: 16px;
  background: white;
  color: #111;
}

.primary, .secondary {
  width: 100%;
  border-radius: 5px;
  padding: 10px;
  margin-bottom: 7px;
  font-size: 13px;
  font-weight: bold;
}

.primary {
  border: 0;
  background: linear-gradient(#56aaf0,#1378d4);
  color: white;
}

.secondary {
  background: #eee;
  border: 1px solid #bbb;
  color: #111;
}

.hint {
  font-size: 11px;
  color: #777;
  line-height: 1.5;
}

/* MUSIC RESULTS */

.result {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px;
  border-bottom: 1px solid #ddd;
}

.result.active {
  background: #dceeff;
}

.result img {
  width: 48px;
  height: 48px;
  border-radius: 3px;
  object-fit: cover;
}

.result-info {
  flex: 1;
  min-width: 0;
  cursor: pointer;
}

.result-title {
  font-size: 12px;
  font-weight: bold;
}

.result-artist {
  margin-top: 3px;
  font-size: 10px;
  color: #777;
}

.add-button {
  width: 28px;
  height: 28px;
  border: 0;
  border-radius: 50%;
  background: #eee;
  color: #1479d3;
  font-size: 20px;
  display: grid;
  place-items: center;
  padding: 0;
}

/* NOW PLAYING */

#playerArea {
  display: none;
  flex: 1;
  min-height: 0;
  overflow-y: auto;
}

#playerArea.visible {
  display: block;
}

#player {
  width: 100%;
  height: 200px;
  display: block;
  background: black;
}

.track-info {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
}

#artwork {
  width: 52px;
  height: 52px;
  object-fit: cover;
  background: #ddd;
}

.track-meta {
  min-width: 0;
  flex: 1;
}

#trackTitle {
  font-size: 13px;
  font-weight: bold;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

#trackArtist {
  color: #777;
  font-size: 11px;
  margin-top: 4px;
}

.progress-area {
  padding: 0 10px 10px;
}

#progress {
  width: 100%;
  accent-color: #2587df;
  margin: 0;
}

.times {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: #666;
}

#message {
  padding: 0 10px 8px;
  color: #a33;
  font-size: 11px;
}

#queueLabel {
  padding: 0 10px 6px;
  color: #777;
  font-size: 10px;
}

/* COLORS */

.color-grid {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 10px;
}

.swatch {
  width: 100%;
  aspect-ratio: 1;
  border: 1px solid #00000022;
  border-radius: 8px;
}

@media(max-height:650px) {
  body:not(.full) {
    align-items: flex-start;
  }
}

</style>
</head>

<body>

<main class="ipod">

  <div class="screen-frame">

    <div class="screen">

      <div class="status">

        <button id="statusPlay"
                onclick="openNowPlaying()"
                aria-label="Now Playing">

          <svg viewBox="0 0 16 16"
               fill="currentColor">
            <path d="M4 2l10 6-10 6z"/>
          </svg>

        </button>

        <span id="header">iClone Music</span>

        <span class="battery"></span>

      </div>

      <div id="content"></div>

      <div id="playerArea">

        <div id="player"></div>

        <div class="track-info">

          <img id="artwork" alt="">

          <div class="track-meta">

            <div id="trackTitle">
              Not Playing
            </div>

            <div id="trackArtist"></div>

          </div>

        </div>

        <div id="queueLabel"></div>

        <div class="progress-area">

          <input id="progress"
                 type="range"
                 min="0"
                 max="100"
                 value="0"
                 step="0.1"
                 aria-label="Playback position">

          <div class="times">

            <span id="elapsed">0:00</span>

            <span id="remaining">-0:00</span>

          </div>

        </div>

        <div id="message"></div>

      </div>

    </div>

  </div>

  <div class="wheel" id="wheel">

    <button class="menu-key"
            onclick="back()">
      MENU
    </button>

    <button class="prev-key"
            onclick="previous()"
            aria-label="Previous">

      <svg viewBox="0 0 24 24"
           fill="currentColor">

        <path d="
          M3 6h2v12H3z
          M13 6v12l-8-6z
          M21 6v12l-8-6z
        "/>

      </svg>

    </button>

    <button class="next-key"
            onclick="next()"
            aria-label="Next">

      <svg viewBox="0 0 24 24"
           fill="currentColor">

        <path d="
          M3 6v12l8-6z
          M11 6v12l8-6z
          M19 6h2v12h-2z
        "/>

      </svg>

    </button>

    <button class="center-key"
            onclick="selectItem()"
            aria-label="Select">
    </button>

    <button class="play-key"
            onclick="togglePlay()"
            aria-label="Play or pause">

      <svg viewBox="0 0 28 24"
           fill="currentColor">

        <path d="
          M3 6v12l10-6z
          M16 6h3v12h-3z
          M22 6h3v12h-3z
        "/>

      </svg>

    </button>

  </div>

</main>

<script>

/* =====================================
   API CONFIGURATION
===================================== */

const DEFAULT_API_KEY =
  "AIzaSyA06qaiW0U6PvLPE2jBA7E2AyBX3PI9ZTY";

const $ = id => document.getElementById(id);

const PRESET_PLAYLIST = {
  id: "PLYUBgjoIh4UA",
  name: "2000's Hits"
};

const PLAY_ICON = `
  <svg viewBox="0 0 16 16" fill="currentColor">
    <path d="M4 2l10 6-10 6z"/>
  </svg>
`;

const PAUSE_ICON = `
  <svg viewBox="0 0 16 16" fill="currentColor">
    <rect x="4" y="2" width="3" height="12"/>
    <rect x="9" y="2" width="3" height="12"/>
  </svg>
`;

const ARROW = `
  <svg viewBox="0 0 10 16">
    <path d="M2 2l6 6-6 6"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </svg>
`;

/* =====================================
   STORAGE
===================================== */

function read(key,fallback) {

  try {

    return JSON.parse(
      localStorage.getItem(key)
    ) ?? fallback;

  } catch {

    return fallback;

  }

}

function write(key,value) {

  try {

    localStorage.setItem(
      key,
      JSON.stringify(value)
    );

  } catch {}

}

let songs = read("iclone-v2-songs",[]);

let playlists = read(
  "iclone-v2-playlists",[]
);

if (!Array.isArray(songs)) songs = [];

if (!Array.isArray(playlists)) playlists = [];

let settings = {

  name: "iClone Music",

  color: "#c8c8cc",

  wheel: "#fafafa",

  full: false,

  shuffle: false,

  repeat: false,

  clicker: true,

  haptics: true,

  apiKey: DEFAULT_API_KEY,

  ...read("iclone-v2-settings",{})

};

settings.apiKey =
  settings.apiKey || DEFAULT_API_KEY;

function saveSettings() {

  write("iclone-v2-settings",settings);

}

function saveLibrary() {

  write("iclone-v2-songs",songs);

  write("iclone-v2-playlists",playlists);

}

if (!playlists.some(
  p => p.id === PRESET_PLAYLIST.id
)) {

  playlists.unshift({...PRESET_PLAYLIST});

}

saveLibrary();

/* =====================================
   APPLICATION STATE
===================================== */

let view = "home";

let selected = 0;

let selectable = [];

let navigation = [];

let currentPage = null;

let player = null;

let playerReady = false;

let playerLoaded = false;

let pendingPlayback = false;

let current = null;

let queue = [];

let queueIndex = 0;

let playlistMode = false;

let playlistShuffle = false;

let playlistInitialized = false;

let seeking = false;

let requestController = null;

let searchResults = [];

let lastQuery = "";

let audioContext = null;

let lastTick = 0;

let sleepTimer = null;

let sleepDeadline = 0;

/* =====================================
   THEME
===================================== */

function applyTheme() {

  const root = document.documentElement;

  root.style.setProperty(
    "--pod",settings.color
  );

  root.style.setProperty(
    "--wheel",settings.wheel
  );

  root.style.setProperty(
    "--icons",
    settings.wheel === "#292929"
      ? "#bbb"
      : "#858585"
  );

  document.body.classList.toggle(
    "full",settings.full
  );

  document.title = settings.name;

  document.querySelector(
    'meta[name="theme-color"]'
  ).setAttribute(
    "content",settings.color
  );

}

/* =====================================
   CLICKER AND HAPTICS
===================================== */

function feedback(strong = false) {

  const now = performance.now();

  if (now - lastTick < 22) return;

  lastTick = now;

  if (settings.haptics) {

    try {

      navigator.vibrate?.(
        strong ? 15 : 8
      );

    } catch {}

  }

  if (!settings.clicker) return;

  try {

    const AudioClass =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioClass) return;

    audioContext ||= new AudioClass();

    if (audioContext.state === "suspended") {

      audioContext.resume().catch(() => {});

    }

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    const time =
      audioContext.currentTime;

    oscillator.type = "triangle";

    oscillator.frequency.value =
      strong ? 750 : 950;

    gain.gain.setValueAtTime(
      .035,time
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,time + .025
    );

    oscillator.connect(gain);

    gain.connect(audioContext.destination);

    oscillator.start(time);

    oscillator.stop(time + .03);

  } catch {}

}

/* =====================================
   NAVIGATION
===================================== */

function openPage(fn) {

  if (currentPage) {

    navigation.push(currentPage);

  }

  currentPage = fn;

  fn();

}

function screen(title,name) {

  requestController?.abort();

  view = name;

  selected = 0;

  selectable = [];

  $("header").textContent = title;

  $("content").style.display = "block";

  $("content").replaceChildren();

  if (playerReady && playerLoaded) {

    try {

      player.pauseVideo();

    } catch {}

  }

  $("playerArea").classList.remove(
    "visible"
  );

}

function menu(title,rows,name) {

  screen(title,name);

  rows.forEach(([label,action],index) => {

    const button =
      document.createElement("button");

    button.className =
      "menu-row" +
      (index === 0 ? " active" : "");

    const text =
      document.createElement("span");

    text.textContent = label;

    button.append(text);

    button.insertAdjacentHTML(
      "beforeend",ARROW
    );

    button.onclick = () => {

      feedback(true);

      selected = index;

      action();

    };

    $("content").append(button);

    selectable.push({
      element: button,
      action
    });

  });

}

function move(direction) {

  if (!selectable.length) return;

  selected = (

    selected +
    direction +
    selectable.length

  ) % selectable.length;

  selectable.forEach((item,index) => {

    item.element.classList.toggle(
      "active",index === selected
    );

  });

  selectable[selected].element.scrollIntoView({

    block: "nearest"

  });

  feedback();

}

function selectItem() {

  feedback(true);

  if (view === "now") {

    togglePlay(false);

    return;

  }

  selectable[selected]?.action();

}

function back() {

  feedback(true);

  const previousPage = navigation.pop();

  if (previousPage) {

    currentPage = previousPage;

    previousPage();

  } else {

    home();

  }

}

/* =====================================
   MAIN MENU
===================================== */

function home() {

  navigation = [];

  currentPage = home;

  menu(settings.name,[

    ["Music",() => openPage(music)],

    ["Search",() => openPage(search)],

    ["Settings",() => openPage(showSettings)],

    ["Shuffle Songs",shuffleSongs],

    ["Now Playing",openNowPlaying],

    ["Sleep",sleep]

  ],"home");

}

function music() {

  menu("Music",[

    ["Playlists",() => openPage(showPlaylists)],

    ["Artists",() => openPage(showArtists)],

    ["Albums",() => openPage(showAlbums)],

    ["Songs",() => openPage(showSongs)],

    ["Search Music",() => openPage(search)],

    ["Import Playlist",() => openPage(importPlaylist)],

    ["Add Song by Link",() => openPage(addSongLink)]

  ],"music");

}

/* =====================================
   API REQUESTS
===================================== */

async function apiRequest(endpoint,params,signal) {

  if (!settings.apiKey) {

    throw new Error(
      "Configure your search API key in Settings."
    );

  }

  const query = new URLSearchParams({

    ...params,

    key: settings.apiKey

  });

  const response = await fetch(

    "https://www.googleapis.com/youtube/v3/" +
    endpoint + "?" + query,

    {signal}

  );

  const data = await response.json();

  if (!response.ok) {

    const reason =
      data.error?.errors?.[0]?.reason;

    if (reason === "quotaExceeded") {

      throw new Error(
        "Daily search quota reached. Try again later."
      );

    }

    throw new Error(

      data.error?.message ||
      "Unable to connect to music search."

    );

  }

  return data;

}

function decode(value) {

  const doc = new DOMParser().parseFromString(

    value || "",

    "text/html"

  );

  return doc.body.textContent || "";

}

function cleanTitle(value) {

  return decode(value)

    .replace(
      /\s*[\[(](official\s*(music\s*)?video|official\s*audio|lyrics?|lyric\s*video|hd|4k|visualizer)[\])]/gi,
      ""
    )

    .trim();

}

function thumbnail(id) {

  return "https://i.ytimg.com/vi/" +
    id + "/mqdefault.jpg";

}

/* =====================================
   SEARCH MUSIC
===================================== */

function search() {

  screen("Search","search");

  $("content").innerHTML = `

    <div class="panel">

      <form id="searchForm">

        <input id="query"
               placeholder="Song, artist or album"
               autocomplete="off">

        <button class="primary" type="submit">
          Search
        </button>

      </form>

      <div id="searchStatus" class="hint">
        Find your favorite music.
      </div>

    </div>

    <div id="results"></div>

  `;

  $("query").value = lastQuery;

  $("searchForm").onsubmit = event => {

    event.preventDefault();

    feedback(true);

    const query = $("query").value.trim();

    if (query) searchMusic(query);

  };

  if (searchResults.length) {

    renderResults(searchResults);

  }

}

async function searchMusic(query) {

  lastQuery = query;

  requestController?.abort();

  const controller = new AbortController();

  requestController = controller;

  $("searchStatus").textContent =
    "Searching...";

  $("results").replaceChildren();

  selectable = [];

  try {

    const data = await apiRequest(

      "search",

      {

        part: "snippet",

        type: "video",

        videoEmbeddable: "true",

        maxResults: "25",

        q: query

      },

      controller.signal

    );

    if (

      view !== "search" ||

      controller.signal.aborted

    ) return;

    searchResults = (data.items || [])

      .filter(item => item.id?.videoId)

      .map(item => ({

        id: item.id.videoId,

        title: cleanTitle(
          item.snippet.title
        ),

        artist: decode(
          item.snippet.channelTitle
        ).replace(/\s*-\s*Topic$/i,""),

        image:
          item.snippet.thumbnails?.medium?.url,

        album: ""

      }));

    renderResults(searchResults);

  } catch(error) {

    if (

      error.name === "AbortError" ||

      view !== "search"

    ) return;

    $("searchStatus").textContent =
      error.message;

  }

}

function renderResults(results) {

  $("results").replaceChildren();

  selectable = [];

  selected = 0;

  $("searchStatus").textContent =

    results.length

      ? results.length + " results"

      : "No songs found.";

  results.forEach((song,index) => {

    const row =
      document.createElement("div");

    row.className = "result";

    const image =
      document.createElement("img");

    image.src =
      song.image || thumbnail(song.id);

    image.alt = "";

    const info =
      document.createElement("div");

    info.className = "result-info";

    const title =
      document.createElement("div");

/* =====================================
   LINK PARSING
===================================== */

function parseLink(value) {

  try {

    let text = value.trim();

    if (!/^https?:\/\//i.test(text)) {

      text = "https://" + text;

    }

    const url = new URL(text);

    const hosts = [

      "youtube.com",

      "www.youtube.com",

      "m.youtube.com",

      "music.youtube.com",

      "youtu.be"

    ];

    if (!hosts.includes(url.hostname)) {

      return null;

    }

    let video = url.searchParams.get("v");

    const list = url.searchParams.get("list");

    if (url.hostname === "youtu.be") {

      video = url.pathname.split("/")[1];

    }

    if (

      /^\/(shorts|embed|live)\//.test(
        url.pathname
      )

    ) {

      video = url.pathname.split("/")[2];

    }

    return {

      video: /^[\w-]{11}$/.test(video || "")

        ? video : null,

      list: /^[\w-]+$/.test(list || "")

        ? list : null

    };

  } catch {

    return null;

  }

}

/* =====================================
   PLAYBACK QUEUE
===================================== */

function shuffled(list) {

  const result = [...list];

  for (

    let i = result.length - 1;

    i > 0;

    i--

  ) {

    const j = Math.floor(
      Math.random() * (i + 1)
    );

    [result[i],result[j]] =

      [result[j],result[i]];

  }

  return result;

}

function startQueue(list,index = 0) {

  if (!list.length) {

    openPage(search);

    return;

  }

  queue = list.map(song => ({...song}));

  queueIndex = Math.max(

    0,

    Math.min(index,queue.length - 1)

  );

  if (settings.shuffle && queue.length > 1) {

    const first = queue[queueIndex];

    queue = [

      first,

      ...shuffled(

        queue.filter(
          (_,i) => i !== queueIndex
        )

      )

    ];

    queueIndex = 0;

  }

  playlistMode = false;

  current = queue[queueIndex];

  enterNowPlaying();

  loadCurrent();

}

function shuffleSongs() {

  if (songs.length) {

    startQueue(shuffled(songs),0);

  } else if (playlists.length) {

    playPlaylist(playlists[0],true);

  } else {

    openPage(search);

  }

}

function playPlaylist(playlist,shuffle) {

  playlistMode = true;

  playlistShuffle = shuffle;

  playlistInitialized = false;

  current = {

    id: playlist.id,

    title: playlist.name,

    artist: "Playlist"

  };

  enterNowPlaying();

  loadCurrent();

}

/* =====================================
   LOAD AND CONTROL PLAYER
===================================== */

function loadCurrent() {

  if (!current) return;

  playerLoaded = false;

  playlistInitialized = false;

  $("message").textContent = "";

  $("progress").value = 0;

  $("elapsed").textContent = "0:00";

  $("remaining").textContent = "-0:00";

  updateTrackDisplay();

  if (!playerReady) {

    pendingPlayback = true;

    $("message").textContent =
      "Connecting to music player...";

    return;

  }

  pendingPlayback = false;

  try {

    if (playlistMode) {

      player.loadPlaylist({

        list: current.id,

        listType: "playlist",

        index: 0,

        startSeconds: 0

      });

    } else {

      player.loadVideoById({

        videoId: current.id,

        startSeconds: 0

      });

    }

    playerLoaded = true;

  } catch(error) {

    $("message").textContent =
      "Unable to load song. Press Play to retry.";

  }

}

function togglePlay(withFeedback = true) {

  if (withFeedback) feedback(true);

  if (!current) {

    openPage(search);

    return;

  }

  enterNowPlaying();

  if (!playerReady || !playerLoaded) {

    loadCurrent();

    return;

  }

  try {

    const state = player.getPlayerState();

    if (state === 1 || state === 3) {

      player.pauseVideo();

    } else if (state === 0) {

      player.seekTo(0,true);

      player.playVideo();

    } else {

      player.playVideo();

    }

  } catch {

    loadCurrent();

  }

}

function next(automatic = false) {

  if (!automatic) feedback(true);

  if (view !== "now" && !automatic) {

    move(1);

    return;

  }

  if (!current || !playerReady) return;

  if (playlistMode) {

    player.nextVideo();

    return;

  }

  if (!queue.length) return;

  let nextIndex = queueIndex + 1;

  if (nextIndex >= queue.length) {

    if (automatic && !settings.repeat) {

      $("statusPlay").innerHTML = PAUSE_ICON;

      return;

    }

    nextIndex = 0;

  }

  queueIndex = nextIndex;

  current = queue[queueIndex];

  loadCurrent();

}

function previous() {

  feedback(true);

  if (view !== "now") {

    move(-1);

    return;

  }

  if (!playerReady || !current) return;

  if (player.getCurrentTime() > 3) {

    player.seekTo(0,true);

    return;

  }

  if (playlistMode) {

    player.previousVideo();

    return;

  }

  if (!queue.length) return;

  queueIndex = (

    queueIndex - 1 + queue.length

  ) % queue.length;

  current = queue[queueIndex];

  loadCurrent();

}

/* =====================================
   OFFICIAL EMBEDDED MUSIC PLAYER
===================================== */

window.onYouTubeIframeAPIReady = function() {

  player = new YT.Player("player",{

    width: "100%",

    height: "200",

    playerVars: {

      playsinline: 1,

      controls: 1,

      rel: 0,

      origin: location.origin

    },

    events: {

      onReady() {

        playerReady = true;

        if (

          pendingPlayback &&

          current &&

          view === "now"

        ) {

          loadCurrent();

        }

      },

      onStateChange(event) {

        const playing = event.data === 1;

        $("statusPlay").innerHTML =

          playing ? PLAY_ICON : PAUSE_ICON;

        if (playing && view !== "now") {

          player.pauseVideo();

          return;

        }

        if (playing) {

          playerLoaded = true;

          $("message").textContent = "";

          if (

            playlistMode &&

            !playlistInitialized

          ) {

            playlistInitialized = true;

            player.setShuffle(

              playlistShuffle ||

              settings.shuffle

            );

            player.setLoop(settings.repeat);

          }

          updatePlayerMetadata();

        }

        if (

          event.data === 0 &&

          !playlistMode &&

          view === "now"

        ) {

          next(true);

        }

      },

      onAutoplayBlocked() {

        $("message").textContent =

          "Tap the video or Play button to start.";

      },

      onError(event) {

        const messages = {

          2: "Invalid song or playlist.",

          5: "This song cannot be played here.",

          100: "Song unavailable or private.",

          101: "Embedded playback is disabled.",

          150: "Embedded playback is disabled.",

          153: "Open the published website directly."

        };

        $("message").textContent =

          (messages[event.data] ||

          "Playback unavailable.") +

          " Press Next to skip.";

      }

    }

  });

};

/* =====================================
   TRACK METADATA
===================================== */

function updatePlayerMetadata() {

  if (!playerReady || !playerLoaded) return;

  try {

    const data = player.getVideoData();

    if (playlistMode) {

      $("trackTitle").textContent =

        cleanTitle(data.title) ||

        current?.title ||

        "";

      $("trackArtist").textContent =

        data.author || "";

      const list = player.getPlaylist();

      const index = player.getPlaylistIndex();

      if (list?.length) {

        $("queueLabel").textContent =

          (index + 1) +

          " of " +

          list.length;

      }

    } else {

      $("trackTitle").textContent =

        current?.title ||

        cleanTitle(data.title);

      $("trackArtist").textContent =

        current?.artist ||

        data.author ||

        "";

    }

    if (data.video_id) {

      const url = thumbnail(data.video_id);

      if ($("artwork").src !== url) {

        $("artwork").src = url;

      }

    }

  } catch {}

}

/* =====================================
   ACCURATE PROGRESS AND SCRUBBING
===================================== */

function formatTime(seconds) {

  seconds = Math.max(

    0,

    Math.floor(seconds || 0)

  );

  const minutes = Math.floor(seconds / 60);

  return minutes +

    ":" +

    String(seconds % 60).padStart(2,"0");

}

setInterval(() => {

  if (

    !playerReady ||

    !playerLoaded ||

    view !== "now"

  ) return;

  try {

    const duration = player.getDuration();

    const elapsed = player.getCurrentTime();

    if (duration > 0) {

      if (!seeking) {

        $("progress").value =

          elapsed / duration * 100;

      }

      $("elapsed").textContent =

        formatTime(elapsed);

      $("remaining").textContent =

        "-" + formatTime(duration - elapsed);

    }

    if (player.getPlayerState() === 1) {

      updatePlayerMetadata();

    }

  } catch {}

},400);

$("progress").addEventListener(

  "pointerdown",

  () => seeking = true

);

$("progress").addEventListener(

  "pointercancel",

  () => seeking = false

);

$("progress").addEventListener(

  "input",

  () => {

    if (!playerReady || !playerLoaded) return;

    const duration = player.getDuration();

    const position =

      Number($("progress").value) /

      100 * duration;

    $("elapsed").textContent =

      formatTime(position);

    $("remaining").textContent =

      "-" + formatTime(duration - position);

  }

);

$("progress").addEventListener(

  "change",

  () => {

    if (playerReady && playerLoaded) {

      const duration = player.getDuration();

      if (duration > 0) {

        player.seekTo(

          Number($("progress").value) /

          100 * duration,

          true

        );

      }

    }

    seeking = false;

    feedback();

  }

);

/* =====================================
   SLEEP TIMER
===================================== */

function showSleepTimer() {

  menu("Sleep Timer",[

    ["Off",() => setSleepTimer(0)],

    ["15 Minutes",() => setSleepTimer(15)],

    ["30 Minutes",() => setSleepTimer(30)],

    ["45 Minutes",() => setSleepTimer(45)],

    ["1 Hour",() => setSleepTimer(60)],

    ["2 Hours",() => setSleepTimer(120)]

  ],"sleepTimer");

}

function setSleepTimer(minutes) {

  clearTimeout(sleepTimer);

  sleepDeadline = 0;

  if (minutes > 0) {

    sleepDeadline = Date.now() +

      minutes * 60000;

    sleepTimer = setTimeout(() => {

      if (playerReady) {

        player.pauseVideo();

      }

      sleepDeadline = 0;

      sleep();

    },minutes * 60000);

  }

  showSettings();

}

function sleep() {

  if (playerReady) {

    player.pauseVideo();

  }

  screen("Sleep","sleep");

  $("content").innerHTML = `

    <div style="
      height:100%;
      background:#111;
      color:#aaa;
      display:grid;
      place-items:center;
    ">

      <button onclick="home()"
              style="
                border:0;
                background:none;
                color:#aaa;
              ">

        Press MENU to wake

      </button>

    </div>

  `;

}

function setAPIKey() {

  screen("Search API Key","apiKey");

  const panel =
    document.createElement("div");

  panel.className = "panel";

  const input =

  input.type = "password";

  input.value = settings.apiKey;

  input.placeholder = "Music search API key";

  const save =
    document.createElement("button");

  save.className = "primary";

  save.textContent = "Save API Key";

  save.onclick = () => {

    settings.apiKey =

      input.value.trim() ||

      DEFAULT_API_KEY;

    saveSettings();

    feedback(true);

    showSettings();

  };

  const reset =
    document.createElement("button");

  reset.className = "secondary";

  reset.textContent = "Restore Default Key";

  reset.onclick = () => {

    settings.apiKey = DEFAULT_API_KEY;

    saveSettings();

    showSettings();

  };

  const test =
    document.createElement("button");

  test.className = "secondary";

  test.textContent = "Test Connection";

  const status =
    document.createElement("p");

  status.className = "hint";

  test.onclick = async () => {

    settings.apiKey =

      input.value.trim() ||

      DEFAULT_API_KEY;

    saveSettings();

    status.textContent = "Testing...";

    try {

      await apiRequest("videos",{

        part: "id",

        chart: "mostPopular",

        maxResults: "1"

      });

      status.textContent =
        "API connection successful.";

    } catch(error) {

      status.textContent = error.message;

    }

  };

  panel.append(input,save,reset,test,status);

  $("content").append(panel);

}

/* =====================================
   ROTATING CLICK WHEEL
===================================== */

const wheel = $("wheel");

let activePointer = null;

let lastAngle = 0;

let accumulatedAngle = 0;

let startX = 0;

let startY = 0;

let rotated = false;

let suppressClickUntil = 0;

let scrubPosition = 0;

function wheelAngle(event) {

  const rect = wheel.getBoundingClientRect();

  return Math.atan2(

    event.clientY -
    rect.top -
    rect.height / 2,

    event.clientX -
    rect.left -
    rect.width / 2

  ) * 180 / Math.PI;

}

wheel.addEventListener(

  "pointerdown",

  event => {

    if (event.target.closest(".center-key")) {

      return;

    }

    if (activePointer !== null) return;

    activePointer = event.pointerId;

    lastAngle = wheelAngle(event);

    accumulatedAngle = 0;

    rotated = false;

    startX = event.clientX;

    startY = event.clientY;

    if (

      view === "now" &&

      playerReady &&

      playerLoaded

    ) {

      scrubPosition = player.getCurrentTime();

    }

  }

);

wheel.addEventListener(

  "pointermove",

  event => {

    if (event.pointerId !== activePointer) {

      return;

    }

    const distance = Math.hypot(

      event.clientX - startX,

      event.clientY - startY

    );

    if (distance < 7 && !rotated) return;

    if (!rotated) {

      rotated = true;

      try {

        wheel.setPointerCapture(
          event.pointerId
        );

      } catch {}

    }

    const angle = wheelAngle(event);

    let delta = angle - lastAngle;

    if (delta > 180) delta -= 360;

    if (delta < -180) delta += 360;

    accumulatedAngle += delta;

    lastAngle = angle;

    while (Math.abs(accumulatedAngle) >= 15) {

      const direction =

        accumulatedAngle > 0 ? 1 : -1;

      if (

        view === "now" &&

        playerReady &&

        playerLoaded

      ) {

        const duration = player.getDuration();

        if (duration > 0) {

          seeking = true;

          scrubPosition = Math.max(

            0,

            Math.min(

              duration,

              scrubPosition + direction * 5

            )

          );

          $("progress").value =

            scrubPosition / duration * 100;

          $("elapsed").textContent =

            formatTime(scrubPosition);

          $("remaining").textContent =

            "-" +

            formatTime(duration - scrubPosition);

          feedback();

        }

      } else {

        move(direction);

      }

      accumulatedAngle -= direction * 15;

    }

  }

);

function finishWheel(event) {

  if (event.pointerId !== activePointer) {

    return;

  }

  if (rotated) {

    suppressClickUntil =

      performance.now() + 180;

    if (

      seeking &&

      view === "now" &&

      playerReady &&

      playerLoaded

    ) {

      player.seekTo(scrubPosition,true);

    }

  }

  seeking = false;

  activePointer = null;

  accumulatedAngle = 0;

  rotated = false;

}

window.addEventListener(

  "pointerup",

  finishWheel

);

window.addEventListener(

  "pointercancel",

  finishWheel

);

wheel.addEventListener(

  "click",

  event => {

    if (

      performance.now() < suppressClickUntil

    ) {

      event.preventDefault();

      event.stopImmediatePropagation();

    }

  },

  true

);

/* =====================================
   KEYBOARD CONTROLS
===================================== */

document.addEventListener(

  "keydown",

  event => {

    if (

      ["INPUT","TEXTAREA","SELECT"]

        .includes(
          document.activeElement?.tagName
        )

    ) return;

    switch(event.key) {

      case "ArrowDown":

        event.preventDefault();

        move(1);

        break;

      case "ArrowUp":

        event.preventDefault();

        move(-1);

        break;

      case "ArrowRight":

        event.preventDefault();

        next();

        break;

      case "ArrowLeft":

        event.preventDefault();

        previous();

        break;

      case "Enter":

        selectItem();

        break;

      case "Escape":

        back();

        break;

      case " ":

        event.preventDefault();

        togglePlay();

        break;

    }

  }

);

   INITIALIZE APPLICATION
===================================== */

saveSettings();

home();
