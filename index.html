
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>iClone Music</title>
<style>
*{box-sizing:border-box}
:root{--pod:#c8c8cc;--wheel:#fafafa}
body{margin:0;background:#111;min-height:100dvh;display:grid;place-items:center;font-family:Arial,sans-serif;padding:16px}
body.full{background:var(--pod);padding:0}
#pod{width:min(380px,100%);background:var(--pod);padding:18px;border-radius:30px;box-shadow:inset 0 2px 5px #fff9,0 12px 35px #0006}
.full #pod{width:100%;min-height:100dvh;border-radius:0;display:flex;flex-direction:column;justify-content:space-between;padding:24px}
.frame{background:#222;padding:7px;border-radius:10px}
.screen{height:310px;background:white;display:flex;flex-direction:column;overflow:hidden;border-radius:4px}
.full .screen{height:46dvh}
.status{background:linear-gradient(white,#b9cad9);height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 9px;font-size:13px;font-weight:bold}
#screen{flex:1;overflow:auto}
button,input{font:inherit}
button{cursor:pointer}
.row{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:white;padding:10px;text-align:left;font-size:14px;font-weight:bold;color:#111}
.row.active{background:linear-gradient(#61b9fa,#1479d4);color:white}
.wheel{position:relative;width:84%;max-width:300px;aspect-ratio:1;background:var(--wheel);border-radius:50%;margin:27px auto 12px;touch-action:none}
.wheel button{position:absolute;transform:translate(-50%,-50%);border:0;background:none;color:#858585;padding:0;display:grid;place-items:center}
.wheel svg{width:24px;height:24px;pointer-events:none}
.menu{left:50%;top:16%;font-weight:bold;font-size:13px;width:30%;height:22%}
.prev{left:16%;top:50%;width:23%;height:30%}
.next{left:84%;top:50%;width:23%;height:30%}
.play{left:50%;top:84%;width:30%;height:23%}
.wheel .center{left:50%;top:50%;width:36%;height:36%;border-radius:50%;background:var(--pod);border:1px solid #0002}
.panel{padding:11px;font-size:13px}
input:not([type=range]){width:100%;border:1px solid #aaa;padding:10px;border-radius:5px;font-size:16px}
.primary{width:100%;border:0;border-radius:5px;background:#2384da;color:white;padding:10px;margin:8px 0;font-weight:bold}
.result{display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid #ddd;cursor:pointer}
.result.active{background:#dceeff}
.result img{width:44px;height:44px;object-fit:cover}
.result small{color:#666}
.result button{margin-left:auto;border:0;border-radius:12px;background:#eee;color:#2782cb;padding:5px 10px}
.now{padding:16px 12px}
.track{display:grid;grid-template-columns:45% 1fr;align-items:center;gap:12px}
.art{width:100%;aspect-ratio:1;object-fit:cover;background:#ddd;box-shadow:0 2px 5px #0003}
.meta{font-size:13px;overflow-wrap:anywhere}
.meta p{margin:6px 0}
#progress{width:100%;accent-color:#2488dc;margin-top:25px}
.times{display:flex;justify-content:space-between;font-size:11px;color:#555}
#message{font-size:11px;text-align:center;color:#777}
.covers{background:linear-gradient(#111,#333);color:white;padding:22px 8px;text-align:center;min-height:100%}
.coverrow{display:grid;grid-template-columns:1fr 1.8fr 1fr;align-items:center;gap:5px}
.coverrow img{width:100%;aspect-ratio:1;object-fit:cover;background:#333}
.coverrow img:first-child{transform:perspective(200px) rotateY(35deg);opacity:.6}
.coverrow img:last-child{transform:perspective(200px) rotateY(-35deg);opacity:.6}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.swatch{width:100%;aspect-ratio:1;border:1px solid #bbb;border-radius:7px}
</style>
</head>
<body>
<main id="pod">
<div class="frame">
<div class="screen">
<div class="status">
<span onclick="openPage(nowPlaying)" id="indicator">▶</span>
<span id="heading">iClone Music</span>
<svg width="23" height="12" viewBox="0 0 24 12">
<rect x="1" y="1" width="20" height="10" rx="1" stroke="#555" fill="none"/>
<rect x="3" y="3" width="16" height="6" fill="#65ad43"/>
<path d="M22 4v4" stroke="#555" stroke-width="2"/>
</svg>
</div>
<div id="screen"></div>
</div>
</div>

<div class="wheel" id="wheel">
<button class="menu" onclick="back()">MENU</button>
<button class="prev" onclick="previous()" aria-label="Previous">
<svg viewBox="0 0 24 24" fill="currentColor">
<path d="M3 6h2v12H3zM13 6v12l-8-6zM21 6v12l-8-6z"/>
</svg>
</button>
<button class="next" onclick="next()" aria-label="Next">
<svg viewBox="0 0 24 24" fill="currentColor">
<path d="M3 6v12l8-6zM11 6v12l8-6zM19 6h2v12h-2z"/>
</svg>
</button>
<button class="center" onclick="choose()" aria-label="Select"></button>
<button class="play" onclick="togglePlay()" aria-label="Play or pause">
<svg viewBox="0 0 28 24" fill="currentColor">
<path d="M3 6v12l10-6zM16 6h3v12h-3zM22 6h3v12h-3z"/>
</svg>
</button>
</div>
</main>

<audio id="audio" preload="auto" playsinline></audio>

<script>
const $=id=>document.getElementById(id);
const audio=$("audio");
const API="https://api.audius.co/v1";
const APP_NAME="iCloneMusic";

function read(key,fallback){
  try{return JSON.parse(localStorage.getItem(key))??fallback}
  catch{return fallback}
}
function save(key,value){
  try{localStorage.setItem(key,JSON.stringify(value))}
  catch{}
}

let settings={
  name:"iClone Music",
  color:"#c8c8cc",
  wheel:"#fafafa",
  full:false,
  shuffle:false,
  repeat:false,
  clicker:true,
  haptics:true,
  apiKey:"",
  ...read("iclone-audius-settings",{})
};

let library=read("iclone-audius-library",[]);
let playlists=read("iclone-audius-playlists",[]);
let queue=[],position=0,current=null;
let page=home,history=[],mode="menu";
let selection=0,items=[],coverIndex=0;
let searchVersion=0,playerVersion=0;
let ctx=null,lastTick=0;

const placeholder="data:image/svg+xml,"+
encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><rect width="300" height="300" fill="#ddd"/><circle cx="150" cy="150" r="110" fill="#333"/><circle cx="150" cy="150" r="33" fill="#999"/><circle cx="150" cy="150" r="6" fill="#333"/></svg>'
);

function image(img,url){
  img.onerror=()=>{
    img.onerror=null;
    img.src=placeholder;
  };
  img.src=url||placeholder;
}

function theme(){
  document.documentElement.style.setProperty("--pod",settings.color);
  document.documentElement.style.setProperty("--wheel",settings.wheel);
  document.body.classList.toggle("full",settings.full);
  document.title=settings.name;
  save("iclone-audius-settings",settings);
}

function store(){
  save("iclone-audius-library",library);
  save("iclone-audius-playlists",playlists);
}

function feedback(){
  if(performance.now()-lastTick<25)return;
  lastTick=performance.now();

  if(settings.haptics){
    try{navigator.vibrate?.(8)}catch{}
  }

  if(!settings.clicker)return;

  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    ctx||=new AC();
    ctx.resume().catch(()=>{});
    const o=ctx.createOscillator();
    const g=ctx.createGain();
    const t=ctx.currentTime;
    o.type="triangle";
    o.frequency.value=850;
    g.gain.setValueAtTime(.025,t);
    g.gain.exponentialRampToValueAtTime(.001,t+.025);
    o.connect(g);
    g.connect(ctx.destination);
    o.start();
    o.stop(t+.03);
  }catch{}
}

function screen(title,type="menu"){
  searchVersion++;
  mode=type;
  items=[];
  selection=0;
  $("heading").textContent=title;
  $("screen").replaceChildren();
}

function openPage(fn){
  history.push(page);
  page=fn;
  fn();
}

function back(){
  feedback();
  page=history.pop()||home;
  page();
}

function menu(title,rows){
  screen(title);
  rows.forEach(([label,action],i)=>{
    const b=document.createElement("button");
    b.className="row"+(i===0?" active":"");
    const name=document.createElement("span");
    name.textContent=label;
    const arrow=document.createElement("span");
    arrow.textContent="›";
    b.append(name,arrow);
    b.onclick=()=>{
      feedback();
      action();
    };
    $("screen").append(b);
    items.push({element:b,action});
  });
}

function move(d){
  if(mode==="cover"){
    const list=albumList();
    if(!list.length)return;
    coverIndex=(coverIndex+d+list.length)%list.length;
    renderCovers();
    feedback();
    return;
  }

  if(!items.length)return;
  selection=(selection+d+items.length)%items.length;
  items.forEach((x,i)=>x.element.classList.toggle("active",i===selection));
  items[selection].element.scrollIntoView({block:"nearest"});
  feedback();
}

function choose(){
  feedback();
  if(mode==="now")togglePlay();
  else if(mode==="cover")playCover();
  else items[selection]?.action();
}

function home(){
  page=home;
  history=[];
  menu(settings.name,[
    ["Music",()=>openPage(music)],
    ["Cover Flow",()=>openPage(coverFlow)],
    ["Search Music",()=>openPage(search)],
    ["Playlists",()=>openPage(showPlaylists)],
    ["Shuffle Songs",()=>startQueue(shuffled(library))],
    ["Now Playing",()=>openPage(nowPlaying)],
    ["Settings",()=>openPage(showSettings)]
  ]);
}

function music(){
  menu("Music",[
    ["Songs",()=>openPage(showSongs)],
    ["Artists",()=>openPage(showArtists)],
    ["Albums",()=>openPage(coverFlow)],
    ["Playlists",()=>openPage(showPlaylists)],
    ["Search Music",()=>openPage(search)],
    ["Trending Music",()=>openPage(trending)],
    ["Add Audio URL",()=>openPage(addAudio)]
  ]);
}

function params(extra={}){
  const p=new URLSearchParams({app_name:APP_NAME,...extra});
  if(settings.apiKey)p.set("api_key",settings.apiKey);
  return p;
}

async function request(path,extra={}){
  const response=await fetch(API+path+"?"+params(extra));

  if(!response.ok){
    throw new Error("Music service returned "+response.status);
  }

  const data=await response.json();
  return data.data||[];
}

function normalize(t){
  return {
    id:t.id,
    title:t.title,
    artist:t.user?.name||"Unknown Artist",
    album:t.album||"",
    artwork:t.artwork?.["1000x1000"]||
      t.artwork?.["480x480"]||
      t.artwork?.["150x150"]||"",
    duration:t.duration,
    source:"audius"
  };
}

function eligible(t){
  return t.is_streamable!==false&&
    t.is_stream_gated!==true&&
    t.is_scheduled_release!==true;
}

function search(){
  screen("Search Music","search");
  $("screen").innerHTML=`
    <div class="panel">
      <form id="form">
        <input id="query" placeholder="Song or artist" required>
        <button class="primary">Search</button>
      </form>
      <p id="notice">Search full-length music.</p>
    </div>
    <div id="results"></div>
  `;

  $("form").onsubmit=async e=>{
    e.preventDefault();
    const token=++searchVersion;
    $("notice").textContent="Searching...";
    $("results").replaceChildren();
    try{
      const data=await request("/tracks/search",{
        query:$("query").value.trim(),
        limit:50
      });
      if(token!==searchVersion)return;
      const tracks=data.filter(eligible).map(normalize);
      $("notice").textContent=tracks.length+" songs";
      renderTracks(tracks,$("results"));
    }catch(error){
      if(token===searchVersion)
        $("notice").textContent=error.message;
    }
  };
}

async function trending(){
  screen("Trending","tracks");
  const token=searchVersion;
  $("screen").textContent="Loading...";
  try{
    const data=await request("/tracks/trending");
    if(token!==searchVersion)return;
    $("screen").replaceChildren();
    renderTracks(data.filter(eligible).map(normalize),$("screen"));
  }catch(error){
    if(token===searchVersion)$("screen").textContent=error.message;
  }
}

function saveTrack(track){
  if(!library.some(s=>s.id===track.id)){
    library.push(track);
    store();
  }
}

function renderTracks(list,target){
  items=[];
  selection=0;

  list.forEach((song,i)=>{
    const row=document.createElement("div");
    row.className="result"+(i===0?" active":"");

    const img=document.createElement("img");
    image(img,song.artwork);

    const text=document.createElement("div");
    const title=document.createElement("b");
    title.textContent=song.title;

    const artist=document.createElement("small");
    artist.textContent=song.artist;

    text.append(title,document.createElement("br"),artist);

    const add=document.createElement("button");
    add.textContent=library.some(s=>s.id===song.id)?"✓":"+";

    add.onclick=e=>{
      e.stopPropagation();
      saveTrack(song);
      add.textContent="✓";
      feedback();
    };

    const action=()=>startQueue(list,i);
    row.onclick=action;
    row.append(img,text,add);
    target.append(row);
    items.push({element:row,action});
  });
}

function showSongs(){
  screen("Songs","tracks");

  if(!library.length){
    menu("Songs",[["Search Music",()=>openPage(search)]]);
    return;
  }
  renderTracks(library,$("screen"));
}

function showArtists(){
  const artists=[...new Set(library.map(t=>t.artist))].sort();
  menu("Artists",artists.map(artist=>[
    artist,()=>openPage(()=>{
      screen(artist,"tracks");
      renderTracks(
        library.filter(t=>t.artist===artist),
        $("screen")
      );
    })
  ]));
}

function showPlaylists(){
  menu("Playlists",[
    ...playlists.map(p=>[
      p.name,()=>openPage(()=>{
        screen(p.name,"tracks");
        renderTracks(
          p.ids.map(id=>library.find(t=>t.id===id)).filter(Boolean),
          $("screen")
        );
      })
    ]),
    ["Create Playlist",()=>{
      const name=prompt("Playlist name");
      if(name?.trim()){
        playlists.push({name:name.trim(),ids:[]});
        store();
        showPlaylists();
      }
    }],
    ["Add Current Song",()=>{
      if(!current)return;
      saveTrack(current);
      openPage(()=>menu("Add Song",playlists.map(p=>[
        p.name,()=>{
          if(!p.ids.includes(current.id)){
            p.ids.push(current.id);
            store();
          }
          back();
        }
      ])));
    }]
  ]);
}

function addAudio(){
  screen("Add Audio");
  $("screen").innerHTML=`
    <div class="panel">
      <input id="title" placeholder="Song title">
      <br><br>
      <input id="artist" placeholder="Artist">
      <br><br>
      <input id="url" placeholder="Authorized HTTPS audio URL">
      <button id="add" class="primary">Save Song</button>
    </div>
  `;

  $("add").onclick=()=>{
    try{
      const url=new URL($("url").value);
      if(url.protocol!=="https:")throw Error();
      saveTrack({
        id:crypto.randomUUID(),
        title:$("title").value||"New Song",
        artist:$("artist").value,
        url:url.href,
        source:"url"
      });
      openPage(showSongs);
    }catch{
      alert("Enter a valid HTTPS audio URL.");
    }
  };
}

function shuffled(list){
  const copy=[...list];
  for(let i=copy.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [copy[i],copy[j]]=[copy[j],copy[i]];
  }
  return copy;
}

function startQueue(list,index=0){
  if(!list.length){
    openPage(search);
    return;
  }
  queue=[...list];
  position=index;

  if(settings.shuffle){
    const chosen=queue[index];
    queue=[chosen,...shuffled(queue.filter((_,i)=>i!==index))];
    position=0;
  }

  if(mode!=="now")openPage(nowPlaying);
  loadTrack(position);
}

async function loadTrack(i){
  const token=++playerVersion;
  position=i;
  current=queue[i];
  if(!current)return;

  audio.pause();

  audio.src=current.source==="url"
    ?current.url
    :API+"/tracks/"+encodeURIComponent(current.id)+
      "/stream?"+params();

  audio.load();
  updateMedia();

  if(mode==="now")nowPlaying();

  message("Loading full track...");

  try{
    await audio.play();
    if(token===playerVersion)message("");
  }catch{
    if(token===playerVersion)
      message("Press Play, or skip if this track is unavailable.");
  }
}

async function togglePlay(){
  feedback();

  if(!current){
    if(library.length)startQueue(library);
    else openPage(search);
    return;
  }

  if(audio.paused){
    try{await audio.play()}
    catch{message("Unable to play this track.")}
  }else audio.pause();
}

function next(auto=false){
  if(mode==="cover"&&!auto){
    move(1);
    return;
  }

  if(!queue.length){
    if(!auto)move(1);
    return;
  }

  if(position===queue.length-1&&auto&&!settings.repeat){
    message("End of queue");
    return;
  }

  loadTrack((position+1)%queue.length);
}

function previous(){
  if(mode==="cover"){
    move(-1);
    return;
  }
  if(!queue.length){
    move(-1);
    return;
  }
  if(audio.currentTime>3)audio.currentTime=0;
  else loadTrack((position-1+queue.length)%queue.length);
}

function nowPlaying(){
  screen("Now Playing","now");

  if(!current){
    $("screen").innerHTML='<div class="panel"><p>No music playing.</p><button class="primary" onclick="openPage(search)">Search Music</button></div>';
    return;
  }

  $("screen").innerHTML=`
    <div class="now">
      <div class="track">
        <img class="art" id="albumArt">
        <div class="meta">
          <b id="songTitle"></b>
          <p id="artistName"></p>
          <p id="albumName"></p>
          <small id="count"></small>
        </div>
      </div>
      <input id="progress" type="range" min="0" max="100" step=".1" value="0">
      <div class="times">
        <span id="elapsed">0:00</span>
        <span id="remaining">-0:00</span>
      </div>
      <p id="message"></p>
      <button class="primary" id="saveCurrent">Save to Library</button>
    </div>
  `;

  image($("albumArt"),current.artwork);
  $("songTitle").textContent=current.title;
  $("artistName").textContent=current.artist;
  $("albumName").textContent=current.album;
  $("count").textContent=(position+1)+" of "+queue.length;

  $("saveCurrent").onclick=()=>{
    saveTrack(current);
    $("saveCurrent").textContent="Saved";
  };

  $("albumArt").onclick=()=>{
    saveTrack(current);
    openPage(coverFlow);
  };

  $("progress").oninput=()=>{
    if(Number.isFinite(audio.duration)){
      audio.currentTime=Number($("progress").value)/100*audio.duration;
    }
  };

  progress();
}

function message(text){
  if($("message"))$("message").textContent=text;
}

function time(s){
  s=Math.max(0,Math.floor(s||0));
  return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
}

function progress(){
  if(!Number.isFinite(audio.duration)||audio.duration<=0)return;

  if($("progress")){
    $("progress").value=audio.currentTime/audio.duration*100;
    $("elapsed").textContent=time(audio.currentTime);
    $("remaining").textContent="-"+time(audio.duration-audio.currentTime);
  }

  try{
    navigator.mediaSession?.setPositionState({
      duration:audio.duration,
      position:Math.min(audio.currentTime,audio.duration),
      playbackRate:audio.playbackRate
    });
  }catch{}
}

audio.ontimeupdate=progress;
audio.onloadedmetadata=progress;
audio.onended=()=>next(true);
audio.onwaiting=()=>message("Buffering...");
audio.onplaying=()=>{
  message("");
  $("indicator").textContent="▶";
};
audio.onpause=()=>{
  $("indicator").textContent="Ⅱ";
};
audio.onerror=()=>{
  message("Track unavailable. Press Next to skip.");
};

function updateMedia(){
  if(!current||!("mediaSession" in navigator))return;

  try{
    navigator.mediaSession.metadata=new MediaMetadata({
      title:current.title,
      artist:current.artist,
      album:current.album||"",
      artwork:current.artwork?[{src:current.artwork}]:[]
    });
  }catch{}
}

if("mediaSession" in navigator){
  const handlers={
    play:()=>audio.play().catch(()=>{}),
    pause:()=>audio.pause(),
    nexttrack:()=>next(),
    previoustrack:previous,
    seekto:d=>{
      if(Number.isFinite(d.seekTime))audio.currentTime=d.seekTime;
    }
  };
  Object.entries(handlers).forEach(([name,fn])=>{
    try{navigator.mediaSession.setActionHandler(name,fn)}catch{}
  });
}

function albumList(){
  const seen=new Set();
  return library.filter(t=>{
    const key=t.artist+"|"+(t.album||t.title);
    if(seen.has(key))return false;
    seen.add(key);
    return true;
  });
}

function coverFlow(){
  const list=albumList();
  if(current){
    const i=list.findIndex(t=>t.id===current.id);
    if(i>=0)coverIndex=i;
  }
  renderCovers();
}

function renderCovers(){
  screen("Cover Flow","cover");
  const list=albumList();

  if(!list.length){
    $("screen").textContent="Save songs to view their covers.";
    return;
  }

  coverIndex=(coverIndex+list.length)%list.length;

  const container=document.createElement("div");
  container.className="covers";
  const row=document.createElement("div");
  row.className="coverrow";

  [-1,0,1].forEach(offset=>{
    const song=list[(coverIndex+offset+list.length)%list.length];
    const img=document.createElement("img");
    image(img,song.artwork);
    img.onclick=()=>offset===0?playCover():move(offset);
    row.append(img);
  });

  const song=list[coverIndex];
  const title=document.createElement("p");
  title.textContent=song.album||song.title;

  const artist=document.createElement("small");
  artist.textContent=song.artist;

  container.append(row,title,artist);
  $("screen").append(container);
}

function playCover(){
  const song=albumList()[coverIndex];
  if(!song)return;

  const list=song.album
    ?library.filter(t=>t.album===song.album&&t.artist===song.artist)
    :[song];

  startQueue(list);
}

function showSettings(){
  const toggle=(key)=>{
    settings[key]=!settings[key];
    theme();
    showSettings();
  };

  menu("Settings",[
    ["Full Screen: "+(settings.full?"On":"Off"),()=>toggle("full")],
    ["Shuffle: "+(settings.shuffle?"On":"Off"),()=>toggle("shuffle")],
    ["Repeat: "+(settings.repeat?"On":"Off"),()=>toggle("repeat")],
    ["Clicker: "+(settings.clicker?"On":"Off"),()=>toggle("clicker")],
    ["Haptics: "+(settings.haptics?"On":"Off"),()=>toggle("haptics")],
    ["iPod Color",()=>openPage(colors)],
    ["iPod Name",()=>{
      const name=prompt("Name",settings.name);
      if(name?.trim())settings.name=name.trim();
      theme();
    }],
    ["Audius API Key",()=>{
      const key=prompt("Optional Audius API key",settings.apiKey);
      if(key!==null){
        settings.apiKey=key.trim();
        theme();
      }
    }]
  ]);
}

function colors(){
  screen("iPod Colors");
  const panel=document.createElement("div");
  panel.className="panel grid";

  const options=[
    "#c8c8cc","#333333","#f5f5f5",
    "#f5a6c8","#ed509e","#db4141",
    "#f3a34c","#f3d759","#92c968",
    "#a8dfca","#63b5e7","#334a80",
    "#aa8bd9","#d3b9ef","#d8c28d",
    "#d8a5a2","#e8dfcd","#73777e"
  ];

  options.forEach(color=>{
    const b=document.createElement("button");
    b.className="swatch";
    b.style.background=color;
    b.onclick=()=>{
      settings.color=color;
      settings.wheel=["#333333","#334a80","#73777e"]
        .includes(color)?"#292929":"#fafafa";
      theme();
      feedback();
    };
    panel.append(b);
  });

  $("screen").append(panel);
}

const wheel=$("wheel");
let pointer=null,angle=0,accum=0;
let rotated=false,suppress=0;
let startX=0,startY=0;

function getAngle(e){
  const r=wheel.getBoundingClientRect();
  return Math.atan2(
    e.clientY-r.top-r.height/2,
    e.clientX-r.left-r.width/2
  );
}

wheel.onpointerdown=e=>{
  if(e.target.closest(".center"))return;
  pointer=e.pointerId;
  angle=getAngle(e);
  accum=0;
  rotated=false;
  startX=e.clientX;
  startY=e.clientY;
};

wheel.onpointermove=e=>{
  if(pointer!==e.pointerId)return;

  if(!rotated&&Math.hypot(e.clientX-startX,e.clientY-startY)<7)return;

  if(!rotated){
    rotated=true;
    try{wheel.setPointerCapture(e.pointerId)}catch{}
  }

  const a=getAngle(e);
  let delta=a-angle;

  if(delta>Math.PI)delta-=Math.PI*2;
  if(delta< -Math.PI)delta+=Math.PI*2;

  angle=a;
  accum+=delta;

  while(Math.abs(accum)>=.26){
    const d=Math.sign(accum);

    if(mode==="now"&&Number.isFinite(audio.duration)){
      audio.currentTime=Math.max(0,Math.min(audio.duration,audio.currentTime+d*5));
      feedback();
    }else move(d);

    accum-=d*.26;
  }
};

function endWheel(e){
  if(pointer!==e.pointerId)return;
  if(rotated)suppress=performance.now()+200;
  pointer=null;
}

window.addEventListener("pointerup",endWheel);
window.addEventListener("pointercancel",endWheel);

wheel.addEventListener("click",e=>{
  if(performance.now()<suppress){
    e.preventDefault();
    e.stopImmediatePropagation();
  }
},true);

theme();
home();
</script>
