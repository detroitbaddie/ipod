
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#c8c8cc">
<title>iClone Music</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --pod:#c8c8cc;
  --wheel:#fafafa;
  --icons:#858585;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100dvh;
  background:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
  appearance:none;
  -webkit-appearance:none;
}

.ipod{
  width:min(100%,380px);
  padding:18px;
  border-radius:30px;
  background:var(--pod);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  box-shadow:inset 0 2px 5px #fff9,
    inset 0 -3px 5px #0002,
    0 15px 50px #0007;
}

body.full{
  background:var(--pod);
  padding:0;
}

body.full .ipod{
  width:100%;
  min-height:100dvh;
  border-radius:0;
  box-shadow:none;
  padding:
    max(18px,env(safe-area-inset-top))
    max(16px,env(safe-area-inset-right))
    max(18px,env(safe-area-inset-bottom))
    max(16px,env(safe-area-inset-left));
}

.screen-frame{
  background:#202020;
  border-radius:12px;
  padding:8px;
}

.screen{
  height:300px;
  background:white;
  border-radius:4px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  color:#111;
}

body.full .screen-frame{
  width:100%;
  max-width:650px;
  margin:0 auto;
}

body.full .screen{
  height:clamp(300px,46dvh,500px);
}

.status{
  display:grid;
  grid-template-columns:24px 1fr 24px;
  align-items:center;
  height:28px;
  flex-shrink:0;
  padding:0 8px;
  font-size:13px;
  font-weight:bold;
  background:linear-gradient(#fff,#c0cbd4);
  border-bottom:1px solid #999;
}

.status button{
  padding:0;
  border:0;
  background:none;
  color:#333;
  display:grid;
  place-items:center;
}

.status svg{
  width:12px;
  height:12px;
}

#header{
  text-align:center;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.battery{
  width:21px;
  height:10px;
  border:1px solid #555;
  border-radius:2px;
  padding:1px;
  position:relative;
}

.battery:before{
  content:"";
  display:block;
  width:85%;
  height:100%;
  background:linear-gradient(#a9e678,#399c30);
}

.battery:after{
  content:"";
  position:absolute;
  right:-3px;
  top:2px;
  width:2px;
  height:4px;
  background:#555;
}

#content{
  flex:1;
  min-height:0;
  overflow:auto;
  overscroll-behavior:contain;
}

.menu-row{
  width:100%;
  min-height:36px;
  padding:9px 10px;
  border:0;
  background:white;
  color:#111;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  font-size:15px;
  font-weight:bold;
  text-align:left;
}

.menu-row span{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.menu-row svg{
  width:9px;
  height:13px;
  flex-shrink:0;
}

.menu-row.active{
  background:linear-gradient(#61b9fa,#1479d4);
  color:white;
}

/* CLICK WHEEL */

.wheel{
  position:relative;
  width:min(84%,290px);
  aspect-ratio:1;
  margin:28px auto 14px;
  border-radius:50%;
  background:var(--wheel);
  box-shadow:0 1px 3px #0002;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  flex-shrink:0;
}

.wheel button{
  position:absolute;
  transform:translate(-50%,-50%);
  border:0;
  background:none;
  color:var(--icons);
  padding:0;
  margin:0;
  display:flex;
  align-items:center;
  justify-content:center;
  touch-action:none;
}

.wheel button svg{
  width:22px;
  height:22px;
  pointer-events:none;
}

.menu-key{
  left:50%;
  top:16%;
  width:30%;
  height:23%;
  font-size:13px;
  font-weight:bold;
}

.prev-key{
  left:16%;
  top:50%;
  width:23%;
  height:30%;
}

.next-key{
  left:84%;
  top:50%;
  width:23%;
  height:30%;
}

.play-key{
  left:50%;
  top:84%;
  width:30%;
  height:23%;
}

.wheel .play-key svg{
  width:26px;
}

.wheel .center-key{
  left:50%;
  top:50%;
  width:36%;
  height:36%;
  border-radius:50%;
  background:var(--pod);
  border:1px solid #0002;
  box-shadow:inset 0 1px 3px #fff7;
  z-index:2;
}

.wheel button:active{
  opacity:.65;
}

body.full .wheel{
  width:min(80vw,37dvh,340px);
  margin:24px auto;
}

/* NOW PLAYING */

.now-playing{
  min-height:100%;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:16px 12px 12px;
}

.track-layout{
  display:grid;
  grid-template-columns:44% minmax(0,1fr);
  gap:12px;
  align-items:center;
}

.album-art{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  background:#ddd;
  box-shadow:0 2px 5px #0003;
}

.track-meta{
  min-width:0;
}

.track-title{
  font-size:15px;
  font-weight:bold;
  overflow-wrap:anywhere;
}

.track-artist{
  margin-top:5px;
  font-size:13px;
}

.track-album{
  margin-top:5px;
  color:#666;
  font-size:12px;
}

.track-count{
  font-size:11px;
  color:#777;
  margin-top:10px;
}

.progress-area{
  margin-top:20px;
}

#progress{
  width:100%;
  height:12px;
  margin:0;
  accent-color:#2488dc;
}

.times{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  color:#666;
  margin-top:5px;
}

.playback-message{
  font-size:11px;
  text-align:center;
  color:#777;
  min-height:15px;
  margin-top:10px;
}

/* COVER FLOW */

.cover-flow{
  min-height:100%;
  background:linear-gradient(#080808,#252525);
  color:white;
  padding:24px 8px 14px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  text-align:center;
}

.cover-row{
  display:grid;
  grid-template-columns:1fr 1.7fr 1fr;
  gap:4px;
  align-items:center;
}

.cover{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  background:#333;
  box-shadow:0 6px 15px #0009;
  cursor:pointer;
}

.cover.left{
  transform:perspective(180px) rotateY(38deg);
  opacity:.6;
}

.cover.right{
  transform:perspective(180px) rotateY(-38deg);
  opacity:.6;
}

.cover.center{
  z-index:2;
  -webkit-box-reflect:below 3px
    linear-gradient(transparent 70%,#fff2);
}

.cover-title{
  margin-top:25px;
  font-size:14px;
  font-weight:bold;
}

.cover-artist{
  margin-top:5px;
  color:#aaa;
  font-size:12px;
}

/* FORMS */

.panel{
  padding:12px;
  font-size:13px;
}

.panel h3{
  margin:0 0 12px;
}

input:not([type=range]),select{
  width:100%;
  padding:10px;
  border:1px solid #aaa;
  border-radius:5px;
  margin-bottom:8px;
  font-size:16px;
  background:white;
  color:#111;
}

.primary,.secondary{
  width:100%;
  padding:10px;
  border-radius:5px;
  margin-bottom:7px;
  font-size:13px;
  font-weight:bold;
}

.primary{
  border:0;
  background:linear-gradient(#56aaf0,#1378d4);
  color:white;
}

.secondary{
  border:1px solid #bbb;
  background:#eee;
  color:#111;
}

.hint{
  font-size:11px;
  color:#777;
  line-height:1.5;
}

/* SEARCH */

.result{
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px;
  border-bottom:1px solid #ddd;
}

.result.active{
  background:#dceeff;
}

.result img{
  width:48px;
  height:48px;
  object-fit:cover;
  border-radius:3px;
}

.result-info{
  flex:1;
  min-width:0;
  cursor:pointer;
}

.result-title{
  font-size:12px;
  font-weight:bold;
}

.result-artist{
  font-size:10px;
  color:#777;
  margin-top:3px;
}

.add-button{
  width:28px;
  height:28px;
  border:0;
  border-radius:50%;
  background:#eee;
  color:#1479d3;
  font-size:20px;
  flex-shrink:0;
}

/* COLORS */

.color-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.swatch{
  width:100%;
  aspect-ratio:1;
  border:1px solid #0002;
  border-radius:8px;
}

@media(max-height:650px){
  body:not(.full){
    align-items:flex-start;
  }
}
</style>
</head>

<body>

<audio id="audio" preload="auto"

<script>

/* =====================================
   CONFIGURATION
===================================== */

const $ = id => document.getElementById(id);

const DEFAULT_API_KEY =
  "AIzaSyA06qaiW0U6PvLPE2jBA7E2AyBX3PI9ZTY";

const audio = $("audio");

const PLACEHOLDER = "data:image/svg+xml," +
  encodeURIComponent(`
    <svg xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 300 300">
      <rect width="300" height="300" fill="#ddd"/>
      <circle cx="150" cy="150" r="110"
        fill="#333"/>
      <circle cx="150" cy="150" r="85"
        fill="none" stroke="#555" stroke-width="2"/>
      <circle cx="150" cy="150" r="65"
        fill="none" stroke="#555" stroke-width="2"/>
      <circle cx="150" cy="150" r="32"
        fill="#aaa"/>
      <circle cx="150" cy="150" r="7"
        fill="#333"/>
    </svg>
  `);

const PLAY_ICON = `
  <svg viewBox="0 0 16 16" fill="currentColor">
    <path d="M4 2l10 6-10 6z"/>
  </svg>
`;

const PAUSE_ICON = `
  <svg viewBox="0 0 16 16" fill="currentColor">
    <path d="M4 2h3v12H4zM9 2h3v12H9z"/>
  </svg>
`;

const ARROW = `
  <svg viewBox="0 0 10 16">
    <path d="M2 2l6 6-6 6"
      fill="none" stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"/>
  </svg>
`;

/* =====================================
   STORAGE
===================================== */

function read(key,fallback){
  try{
    return JSON.parse(localStorage.getItem(key))
      ?? fallback;
  }catch{
    return fallback;
  }
}

function write(key,value){
  try{
    localStorage.setItem(key,JSON.stringify(value));
  }catch{
    console.warn("Storage unavailable");
  }
}

let settings = {
  name:"iClone Music",
  color:"#c8c8cc",
  wheel:"#fafafa",
  full:false,
  shuffle:false,
  repeat:false,
  clicker:true,
  haptics:true,
  apiKey:DEFAULT_API_KEY,
  ...read("iclone-v2-settings",{})
};

settings.apiKey =
  settings.apiKey || DEFAULT_API_KEY;

let songs = read("iclone-v2-songs",[]);
let playlists = read("iclone-v2-playlists",[]);

if(!Array.isArray(songs)) songs=[];
if(!Array.isArray(playlists)) playlists=[];

songs = songs.map(song=>({
  ...song,
  source:song.source ||
    (song.url ? "url" : "youtube"),
  album:song.album || "",
  artwork:song.artwork || song.image || ""
}));

function saveLibrary(){
  write("iclone-v2-songs",songs);
  write("iclone-v2-playlists",playlists);
}

function saveSettings(){
  write("iclone-v2-settings",settings);
}

function uid(){
  return crypto.randomUUID?.() ||
    Date.now()+"-"+Math.random().toString(36).slice(2);
}

/* =====================================
   INDEXED DB FOR LOCAL MUSIC FILES
===================================== */

const database = new Promise((resolve,reject)=>{
  const request = indexedDB.open(
    "iCloneAudioLibrary",1
  );

  request.onupgradeneeded=()=>{
    const db=request.result;

    if(!db.objectStoreNames.contains("files")){
      db.createObjectStore("files");
    }
  };

  request.onsuccess=()=>resolve(request.result);
  request.onerror=()=>reject(request.error);
});

async function storeFile(id,file){
  const db=await database;

  return new Promise((resolve,reject)=>{
    const tx=db.transaction("files","readwrite");

    tx.objectStore("files").put(file,id);

    tx.oncomplete=resolve;
    tx.onerror=()=>reject(tx.error);
    tx.onabort=()=>reject(tx.error);
  });
}

async function getFile(id){
  const db=await database;

  return new Promise((resolve,reject)=>{
    const request=db.transaction("files","readonly")
      .objectStore("files").get(id);

    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>reject(request.error);
  });
}

async function deleteFile(id){
  const db=await database;

  return new Promise((resolve,reject)=>{
    const tx=db.transaction("files","readwrite");

    tx.objectStore("files").delete(id);

    tx.oncomplete=resolve;
    tx.onerror=()=>reject(tx.error);
  });
}

/* =====================================
   APPLICATION STATE
===================================== */

let view="home";
let selected=0;
let selectable=[];
let navigation=[];
let currentPage=null;

let queue=[];
let queueIndex=0;
let current=null;
let objectURL=null;
let loadToken=0;
let loading=false;
let playbackMessage="";
let seeking=false;
let coverIndex=0;
let searchController=null;
let audioContext=null;
let lastTick=0;
let sleepTimer=null;

let searchResults=[];
let lastQuery="";

/* =====================================
   THEME
===================================== */

function applyTheme(){
  document.documentElement.style.setProperty(
    "--pod",settings.color
  );

  document.documentElement.style.setProperty(
    "--wheel",settings.wheel
  );

  document.documentElement.style.setProperty(
    "--icons",
    settings.wheel==="#292929"
      ? "#bbb" : "#858585"
  );

  document.body.classList.toggle(
    "full",settings.full
  );

  document.title=settings.name;

  document.querySelector('meta[name="theme-color"]')
    .setAttribute("content",settings.color);
}

/* =====================================
   CLICKER AND HAPTICS
===================================== */

function feedback(strong=false){
  const now=performance.now();

  if(now-lastTick<22) return;

  lastTick=now;

  if(settings.haptics){
    try{
      navigator.vibrate?.(strong?15:8);
    }catch{}
  }

  if(!settings.clicker) return;

  try{
    const AudioClass=window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioClass) return;

    audioContext ||= new AudioClass();

    if(audioContext.state==="suspended"){
      audioContext.resume().catch(()=>{});
    }

    const oscillator=audioContext.createOscillator();
    const gain=audioContext.createGain();
    const time=audioContext.currentTime;

    oscillator.type="triangle";
    oscillator.frequency.value=strong?750:950;

    gain.gain.setValueAtTime(.035,time);

    gain.gain.exponentialRampToValueAtTime(
      .001,time+.025
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start(time);
    oscillator.stop(time+.03);

  }catch{}
}

/* =====================================
   NAVIGATION
===================================== */

function openPage(fn){
  if(currentPage) navigation.push(currentPage);

  currentPage=fn;
  fn();
}

function screen(title,name){
  searchController?.abort();

  view=name;
  selected=0;
  selectable=[];

  $("header").textContent=title;
  $("content").replaceChildren();
}

function menu(title,rows,name){
  screen(title,name);

  rows.forEach(([label,action],index)=>{
    const button=document.createElement("button");

    button.className="menu-row"+
      (index===0?" active":"");

    const text=document.createElement("span");

    text.textContent=label;

    button.append(text);
    button.insertAdjacentHTML("beforeend",ARROW);

    button.onclick=()=>{
      feedback(true);
      selected=index;
      action();
    };

    $("content").append(button);

    selectable.push({
      element:button,
      action
    });
  });
}

function back(){
  feedback(true);

  const page=navigation.pop();

  if(page){
    currentPage=page;
    page();
  }else{
    home();
  }
}

function move(direction){
  if(view==="cover"){
    moveCover(direction);
    return;
  }

  if(!selectable.length) return;

  selected=(
    selected+direction+selectable.length
  )%selectable.length;

  selectable.forEach((item,index)=>{
    item.element.classList.toggle(
      "active",index===selected
    );
  });

  selectable[selected].element.scrollIntoView({
    block:"nearest"
  });

  feedback();
}

function selectItem(){
  feedback(true);

  if(view==="now"){
    togglePlay(false);
    return;
  }

  if(view==="cover"){
    playCover();
    return;
  }

  selectable[selected]?.action();
}

function home(){
  navigation=[];
  currentPage=home;

  menu(settings.name,[
    ["Music",()=>openPage(music)],
    ["Cover Flow",()=>openPage(showCoverFlow)],
    ["Search",()=>openPage(search)],
    ["Settings",()=>openPage(showSettings)],
    ["Shuffle Songs",shuffleSongs],
    ["Now Playing",openNowPlaying],
    ["Sleep",sleep]
  ],"home");
}

function music(){
  menu("Music",[
    ["Playlists",()=>openPage(showPlaylists)],
    ["Artists",()=>openPage(showArtists)],
    ["Albums",()=>openPage(showAlbums)],
    ["Songs",()=>openPage(showSongs)],
    ["Cover Flow",()=>openPage(showCoverFlow)],
    ["Search Music",()=>openPage(search)],
    ["Import Audio Files",importFiles],
    ["Add Audio URL",()=>openPage(addAudioURL)],
    ["Import YouTube Playlist",()=>openPage(importPlaylist)]
  ],"music");
}

/* =====================================
   REAL ALBUM ARTWORK
===================================== */

const artworkCache=read("iclone-artwork-cache",{});

function normalize(text){
  return String(text||"")
    .toLowerCase()
    .replace(/[^a-z0-9]/g,"");
}

function cleanTitle(value){
  return String(value||"")
    .replace(/\s*[\[(](official.*?|lyrics?|audio|hd|4k|visualizer)[\])]/gi,"")
    .trim();
}

function safeImage(url){
  if(!url) return PLACEHOLDER;

  try{
    const parsed=new URL(url);

    if(parsed.protocol==="https:"){
      return parsed.href;
    }

    if(url.startsWith("data:image/")){
      return url;
    }
  }catch{}

  return PLACEHOLDER;
}

function setImage(element,url){
  element.onerror=()=>{
    element.onerror=null;
    element.src=PLACEHOLDER;
  };

  element.src=safeImage(url);
}

function itunesRequest(term){
  return new Promise((resolve,reject)=>{
    const callback="itunes_"+uid().replace(/-/g,"");

    const script=document.createElement("script");

    let timeout;

    function cleanup(){
      clearTimeout(timeout);
      script.remove();
      delete window[callback];
    }

    window[callback]=data=>{
      cleanup();
      resolve(data.results||[]);
    };

    script.onerror=()=>{
      cleanup();
      reject(new Error("Artwork lookup unavailable"));
    };

    timeout=setTimeout(()=>{
      cleanup();
      reject(new Error("Artwork lookup timed out"));
    },8000);

    const params=new URLSearchParams({
      term,
      entity:"song",
      limit:"12",
      country:"US",
      callback
    });

    script.src="https://itunes.apple.com/search?"+params;

    document.head.append(script);
  });
}

async function findArtwork(song,force=false){
  if(song.artworkMatched&&!force) return song;

  const key=normalize(
    song.artist+" "+song.title
  );

  let match=artworkCache[key];

  if(!match||force){
    try{
      const results=await itunesRequest(
        song.artist+" "+song.title
      );

      const title=normalize(song.title);
      const artist=normalize(song.artist);

      match=results.find(item=>{
        const t=normalize(item.trackName);
        const a=normalize(item.artistName);

        return t===title &&
          (!artist||a===artist||
            a.includes(artist)||artist.includes(a));
      });

      if(!match){
        match=results.find(item=>
          normalize(item.trackName)===title
        );
      }

      if(match){
        artworkCache[key]=match;

        write("iclone-artwork-cache",artworkCache);
      }

    }catch{}
  }

  if(match){
    song.artwork=(match.artworkUrl100||"")
      .replace("100x100bb","600x600bb");

    song.album=song.album ||
      match.collectionName || "";

    song.artist=song.artist ||
      match.artistName || "";

    song.artworkMatched=true;

    saveLibrary();
  }

  return song;
}

async function refreshArtwork(song){
  await findArtwork(song,true);

  if(current?.id===song.id){
    current=song;
    updateMediaSession();

    if(view==="now") nowPlaying();
  }

  if(view==="cover") renderCoverFlow();
}

function validAudioURL(value){
  try{
    const url=new URL(value.trim());

    if(url.protocol!=="https:") return null;

    if(/(^|\.)youtube\.com$|(^|\.)youtu\.be$/
      .test(url.hostname)) return null;

    return url.href;

  }catch{
    return null;
  }
}

/* =====================================
   MUSIC SEARCH
===================================== */

async function youtubeAPI(endpoint,params,signal){
  if(!settings.apiKey){
    throw new Error("Add your YouTube API key.");
  }

  const query=new URLSearchParams({
    ...params,
    key:settings.apiKey
  });

  const response=await fetch(
    "https://www.googleapis.com/youtube/v3/"+
    endpoint+"?"+query,
    {signal}
  );

  const data=await response.json();

  if(!response.ok){
    throw new Error(
      data.error?.message||"Search unavailable"
    );
  }

  return data;
}

function decode(value){
  return new DOMParser()
    .parseFromString(value||"","text/html")
    .body.textContent||"";
}

function search(){
  screen("Search","search");

  $("content").innerHTML=`
    <div class="panel">

      <form id="searchForm">

            Music previews
          </option>
          <option value="youtube">

          </option>
        </select>

        <button class="primary" type="submit">
          Search
        </button>
      </form>

      <div id="searchStatus" class="hint">
        Find songs and album covers.
      </div>

    </div>

    <div id="results"></div>
  `;

  $("query").value=lastQuery;

  $("searchForm").onsubmit=event=>{
    event.preventDefault();

    const query=$("query").value.trim();

    if(query){
      searchMusic(query,$("searchSource").value);

async function searchMusic(query,source){
  lastQuery=query;

  searchController?.abort();

  const controller=new AbortController();

  searchController=controller;

  $("searchStatus").textContent="Searching...";
  $("results").replaceChildren();

  selectable=[];

  try{
    let results=[];

    if(source==="itunes"){
      const data=await itunesRequest(query);

      results=data.map(item=>({
        id:"itunes-"+item.trackId,
        title:item.trackName,
        artist:item.artistName,
        album:item.collectionName,
        artwork:(item.artworkUrl100||"")
          .replace("100x100bb","600x600bb"),
        artworkMatched:true,
        source:"preview",
        url:item.previewUrl||"",
        storeURL:item.trackViewUrl||""
      })).filter(song=>song.url);

    }else{
      const data=await youtubeAPI("search",{
        part:"snippet",
        type:"video",
        videoCategoryId:"10",
        maxResults:"25",
        q:query
      },controller.signal);

      results=(data.items||[])
        .filter(item=>item.id?.videoId)
        .map(item=>({
          id:item.id.videoId,
          title:cleanTitle(decode(item.snippet.title)),
          artist:decode(item.snippet.channelTitle)
            .replace(/\s*-\s*Topic$/i,""),
          album:"",
          artwork:item.snippet.thumbnails?.medium?.url,
          source:"youtube"
        }));
    }

    if(controller.signal.aborted||
      view!=="search") return;

    searchResults=results;
    renderResults(results);

  }catch(error){
    if(controller.signal.aborted||
      view!=="search") return;

    $("searchStatus").textContent=error.message;
  }
}

function renderResults(results){
  $("results").replaceChildren();

  selectable=[];
  selected=0;

  $("searchStatus").textContent=
    results.length+" results";

  results.forEach((song,index)=>{
    const row=document.createElement("div");
    row.className="result";

    const image=document.createElement("img");
    setImage(image,song.artwork);

    const info=document.createElement("div");
    info.className="result-info";

    const title=document.createElement("div");
    title.className="result-title";
    title.textContent=song.title;

    const artist=document.createElement("div");
    artist.className="result-artist";

    artist.textContent=song.artist+
      (song.source==="preview"
        ?" · Preview"
        :" · Discovery");

    info.append(title,artist);

    const action=()=>{
      if(song.source==="youtube"){
        openPage(()=>discoveryOptions(song));
      }else{
        startQueue(results,index);
      }
    };

    image.onclick=action;
    info.onclick=action;

    const add=document.createElement("button");
    add.className="add-button";

    add.textContent=songs.some(s=>s.id===song.id)
      ?"✓":"+";

    add.onclick=()=>{
      saveSong(song);
      add.textContent="✓";
      feedback(true);
    };

    row.append(image,info,add);
    $("results").append(row);

    selectable.push({element:row,action});
  });

  selectable[0]?.element.classList.add("active");
}

async function loadPlaylistTracks(playlist){
  screen(playlist.name,"loadingPlaylist");

  $("content").innerHTML=`
    <div class="panel">
      Importing track information...
    </div>
  `;

  const controller=new AbortController();
  searchController=controller;

  try{
    const tracks=[];
    let pageToken="";

    do{
      const params={
        part:"snippet,contentDetails",
        playlistId:playlist.id,
        maxResults:"50"
      };

      if(pageToken) params.pageToken=pageToken;

      const data=await youtubeAPI(
        "playlistItems",
        params,
        controller.signal
      );

      for(const item of data.items||[]){
        const id=item.contentDetails?.videoId;

        if(!id||
          ["Private video","Deleted video"]
            .includes(item.snippet.title)){
          continue;
        }

        const song={
          id,
          title:cleanTitle(item.snippet.title),
          artist:item.snippet.videoOwnerChannelTitle||
            item.snippet.channelTitle||"",
          album:"",
          artwork:item.snippet.thumbnails?.medium?.url,
          source:"youtube"
        };

        if(!songs.some(s=>s.id===id)){
          songs.push(song);
        }

        tracks.push(id);
      }

      pageToken=data.nextPageToken||"";

    }while(pageToken&&tracks.length<500);

    playlist.tracks=[...new Set(tracks)];

    saveLibrary();

    currentPage=()=>playlistOptions(playlist);
    playlistOptions(playlist);

  }catch(error){
    if(controller.signal.aborted) return;

    $("content").textContent=error.message;
  }
}

/* =====================================
   COVER FLOW
===================================== */

function albumList(){
  const list=[];
  const seen=new Set();

  songs.forEach(song=>{
    const key=normalize(
      song.artist+" "+(song.album||song.title)
    );

    if(!seen.has(key)){
      seen.add(key);
      list.push(song);
    }
  });

  return list;
}

function showCoverFlow(){
  const list=albumList();

  if(current){
    const index=list.findIndex(s=>
      s.id===current.id||
      (s.album&&s.album===current.album&&
        s.artist===current.artist)
    );

    if(index>=0) coverIndex=index;
  }

  renderCoverFlow();
}

function renderCoverFlow(){
  screen("Cover Flow","cover");

  const list=albumList();

  if(!list.length){
    $("content").innerHTML=`
      <div class="panel">
        <h3>No albums yet</h3>

        <button class="primary"
          onclick="openPage(search)">
          Find Music
        </button>
      </div>
    `;
    return;
  }

  coverIndex=(
    coverIndex+list.length
  )%list.length;

  const song=list[coverIndex];

  const container=document.createElement("div");
  container.className="cover-flow";

  const row=document.createElement("div");
  row.className="cover-row";

  [-1,0,1].forEach(offset=>{
    const item=list[
      (coverIndex+offset+list.length)%list.length
    ];

    const img=document.createElement("img");

    img.className="cover "+
      (offset===0?"center":offset<0?"left":"right");

    setImage(img,item.artwork);

    img.onclick=()=>{
      if(offset===0){
        playCover();
      }else{
        moveCover(offset);
      }
    };

    row.append(img);
  });

  const title=document.createElement("div");
  title.className="cover-title";
  title.textContent=song.album||song.title;

  const artist=document.createElement("div");
  artist.className="cover-artist";
  artist.textContent=song.artist||"Unknown Artist";

  container.append(row,title,artist);
  $("content").append(container);

  if(!song.artworkMatched&&!song.artworkRequested){
    song.artworkRequested=true;

    findArtwork(song).then(()=>{
      if(view==="cover") renderCoverFlow();
    });
  }
}

function moveCover(direction){
  const list=albumList();

  if(!list.length) return;

  coverIndex=(
    coverIndex+direction+list.length
  )%list.length;

  feedback();
  renderCoverFlow();
}

function playCover(){
  const song=albumList()[coverIndex];

  if(!song) return;

  const list=song.album
    ? songs.filter(s=>
        s.album===song.album&&
        s.artist===song.artist
      )
    : [song];

  openPage(()=>showTrackList(
    song.album||song.title,list
  ));
}

/* =====================================
   AUDIO PLAYBACK ENGINE
===================================== */

function shuffled(list){
  const result=[...list];

  for(let i=result.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));

    [result[i],result[j]]=[result[j],result[i]];
  }

  return result;
}

function startQueue(list,index=0){
  const first=list[index];

  queue=list.filter(playable);

  if(!queue.length){
    if(first){
      openPage(()=>addAudioURL(first));
    }else{
      openPage(search);
    }
    return;
  }

  queueIndex=Math.max(
    0,queue.findIndex(s=>s.id===first?.id)
  );

  if(settings.shuffle&&queue.length>1){
    const chosen=queue[queueIndex];

    queue=[
      chosen,
      ...shuffled(queue.filter(
        (_,i)=>i!==queueIndex
      ))
    ];

    queueIndex=0;
  }

  enterNowPlaying();
  loadTrack(queueIndex,true);
}

function shuffleSongs(){
  const list=songs.filter(playable);

  if(!list.length){
    openPage(search);
    return;
  }

  startQueue(shuffled(list),0);
}

async function loadTrack(index,autoplay=true){
  if(!queue.length) return;

  const token=++loadToken;

  loading=true;

  audio.pause();
  audio.removeAttribute("src");
  audio.load();

  if(objectURL){
    URL.revokeObjectURL(objectURL);
    objectURL=null;
  }

  queueIndex=index;
  current=queue[index];

  playbackMessage="Loading...";
  updateMediaSession();

  if(view==="now") nowPlaying();

  try{
    let url;

    if(current.source==="local"){
      const file=await getFile(current.id);

      if(token!==loadToken) return;

      if(!file){
        throw new Error("Local audio file is missing.");
      }

      objectURL=URL.createObjectURL(file);
      url=objectURL;

    }else{
      url=validAudioURL(current.url||"");

      if(!url){
        throw new Error("No playable audio source.");
      }
    }

    if(token!==loadToken) return;

    audio.src=url;
    audio.load();

    loading=false;
    playbackMessage="";

    if(autoplay){
      try{
        await audio.play();
      }catch{
        if(token!==loadToken) return;

        playbackMessage="Press Play to start.";
      }
    }

    if(token!==loadToken) return;

    updatePlaybackUI();

    const song=current;

    findArtwork(song).then(()=>{
      if(current?.id===song.id){
        updateMediaSession();

        if(view==="now") nowPlaying();
      }
    });

  }catch(error){
    if(token!==loadToken) return;

    loading=false;
    playbackMessage=error.message;

    updatePlaybackUI();
  }
}

async function togglePlay(withFeedback=true){
  if(withFeedback) feedback(true);

  if(!current){
    const list=songs.filter(playable);

    if(list.length){
      startQueue(list,0);
    }else{
      openPage(search);
    }

    return;
  }

  if(loading) return;

  if(!audio.getAttribute("src")){
    loadTrack(queueIndex,true);
    return;
  }

  if(audio.paused){
    try{
      await audio.play();
      playbackMessage="";
    }catch{
      playbackMessage="Unable to play this audio.";
    }
  }else{
    audio.pause();
  }

  updatePlaybackUI();
}

function next(automatic=false){
  if(!automatic) feedback(true);

  if(view==="cover"&&!automatic){
    moveCover(1);
    return;
  }

  if(!queue.length){
    if(!automatic) move(1);
    return;
  }

  let index=queueIndex+1;

  if(index>=queue.length){
    if(automatic&&!settings.repeat){
      playbackMessage="End of queue";
      updatePlaybackUI();
      return;
    }

    index=0;
  }

  loadTrack(index,true);
}

function previous(){
  feedback(true);

  if(view==="cover"){
    moveCover(-1);
    return;
  }

  if(!queue.length){
    move(-1);
    return;
  }

  if(audio.currentTime>3){
    audio.currentTime=0;
    return;
  }

  loadTrack(
    (queueIndex-1+queue.length)%queue.length,
    true
  );
}

audio.addEventListener("ended",()=>next(true));

audio.addEventListener("play",()=>{
  playbackMessage="";
  updatePlaybackUI();
});

audio.addEventListener("pause",updatePlaybackUI);

audio.addEventListener("waiting",()=>{
  playbackMessage="Buffering...";
  updatePlaybackUI();
});

audio.addEventListener("playing",()=>{
  playbackMessage="";
  updatePlaybackUI();
});

audio.addEventListener("error",()=>{
  if(!audio.getAttribute("src")) return;

  playbackMessage=
    "Audio unavailable. Check the file or URL.";

  updatePlaybackUI();
});

audio.addEventListener("timeupdate",updateProgress);

audio.addEventListener("loadedmetadata",()=>{
  updateProgress();
  updateMediaSession();
});

audio.addEventListener("durationchange",updateProgress);

/* =====================================
   NOW PLAYING SCREEN
===================================== */

function enterNowPlaying(){

function nowPlaying(){
  screen("Now Playing","now");

  if(!current){
    $("content").innerHTML=`
      <div class="panel">
        <h3>No music playing</h3>

        <button class="primary"
          onclick="openPage(search)">
          Find Music
        </button>

        <button class="secondary"
          onclick="importFiles()">
          Import Music
        </button>
      </div>
    `;
    return;
  }

  $("content").innerHTML=`
    <div class="now-playing">

      <div class="track-layout">

        <img id="artwork"
          class="album-art" alt="Album artwork">

        <div class="track-meta">

          <div id="trackTitle"
            class="track-title"></div>

          <div id="trackArtist"
            class="track-artist"></div>

          <div id="trackAlbum"
            class="track-album"></div>

          <div id="trackCount"
            class="track-count"></div>

        </div>

      </div>

      <div class="progress-area">

        <input id="progress"
          type="range"
          min="0"
          max="100"
          step="0.1"
          value="0"
          aria-label="Playback position">

        <div class="times">
          <span id="elapsed">0:00</span>
          <span id="remaining">-0:00</span>
        </div>

        <div id="playbackMessage"
          class="playback-message"></div>

      </div>

    </div>
  `;

  setImage($("artwork"),current.artwork);

  $("trackTitle").textContent=current.title||"";
  $("trackArtist").textContent=current.artist||"";
  $("trackAlbum").textContent=current.album||"";

  $("trackCount").textContent=
    (queueIndex+1)+" of "+queue.length+
    (current.source==="preview"?" · Preview":"");

  $("artwork").onclick=()=>{
    openPage(showCoverFlow);
  };

  const progress=$("progress");

  progress.onpointerdown=()=>seeking=true;

  progress.onpointercancel=()=>{
    seeking=false;
    updateProgress();
  };

  progress.oninput=()=>{
    if(!Number.isFinite(audio.duration)) return;

    const position=
      Number(progress.value)/100*audio.duration;

    $("elapsed").textContent=formatTime(position);

    $("remaining").textContent=
      "-"+formatTime(audio.duration-position);
  };

  progress.onchange=()=>{
    if(Number.isFinite(audio.duration)){
      audio.currentTime=
        Number(progress.value)/100*audio.duration;
    }

    seeking=false;
    feedback();
  };

  updatePlaybackUI();
  updateProgress();
}

function formatTime(seconds){
  seconds=Math.max(
    0,Math.floor(Number(seconds)||0)
  );

  return Math.floor(seconds/60)+":"+
    String(seconds%60).padStart(2,"0");
}

function updateProgress(){
  if(view!=="now"||!$("progress")) return;

  const duration=audio.duration;
  const time=audio.currentTime||0;

  if(!Number.isFinite(duration)||duration<=0){
    return;
  }

  if(!seeking){
    $("progress").value=time/duration*100;

    $("elapsed").textContent=formatTime(time);

    $("remaining").textContent=
      "-"+formatTime(duration-time);
  }

  try{
    navigator.mediaSession?.setPositionState({
      duration,
      position:Math.min(time,duration),
      playbackRate:audio.playbackRate
    });
  }catch{}
}

function updatePlaybackUI(){
  $("statusPlay").innerHTML=
    audio.paused?PAUSE_ICON:PLAY_ICON;

  if($("playbackMessage")){
    $("playbackMessage").textContent=
      playbackMessage||
      (audio.paused?"Paused":"Playing");
  }

  if("mediaSession" in navigator){
    navigator.mediaSession.playbackState=
      audio.paused?"paused":"playing";
  }
}

/* =====================================
   LOCK SCREEN MEDIA CONTROLS
===================================== */

function updateMediaSession(){
  if(!current||
    !("mediaSession" in navigator)||
    !window.MediaMetadata) return;

  try{
    navigator.mediaSession.metadata=
      new MediaMetadata({
        title:current.title||"",
        artist:current.artist||"",
        album:current.album||"",
        artwork:current.artwork?[{
          src:safeImage(current.artwork)
        }]:[]
      });
  }catch{}
}

if("mediaSession" in navigator){
  const handlers={
    play:()=>audio.play().catch(()=>{}),
    pause:()=>audio.pause(),
    nexttrack:()=>next(),
    previoustrack:()=>previous(),

    seekto:details=>{
      if(Number.isFinite(details.seekTime)){
        audio.currentTime=details.seekTime;
      }
    },

    seekforward:details=>{
      if(Number.isFinite(audio.duration)){
        audio.currentTime=Math.min(
          audio.duration,
          audio.currentTime+(details.seekOffset||10)
        );
      }
    },

    seekbackward:details=>{
      audio.currentTime=Math.max(
        0,
        audio.currentTime-(details.seekOffset||10)
      );
    }
  };

  Object.entries(handlers).forEach(([name,handler])=>{
    try{
      navigator.mediaSession.setActionHandler(
        name,handler
      );
    }catch{}
  });
}

/* =====================================
   ROTATING CLICK WHEEL
===================================== */

const wheel=$("wheel");

let activePointer=null;
let lastAngle=0;
let accumulated=0;
let rotated=false;
let startX=0;
let startY=0;
let suppressUntil=0;
let scrubPosition=0;

function wheelAngle(event){
  const rect=wheel.getBoundingClientRect();

  return Math.atan2(
    event.clientY-rect.top-rect.height/2,
    event.clientX-rect.left-rect.width/2
  )*180/Math.PI;
}

wheel.addEventListener("pointerdown",event=>{
  if(event.target.closest(".center-key")) return;
  if(activePointer!==null) return;

  activePointer=event.pointerId;

  lastAngle=wheelAngle(event);
  accumulated=0;
  rotated=false;

  startX=event.clientX;
  startY=event.clientY;

  scrubPosition=audio.currentTime||0;
});

wheel.addEventListener("pointermove",event=>{
  if(event.pointerId!==activePointer) return;

  const distance=Math.hypot(
    event.clientX-startX,
    event.clientY-startY
  );

  if(distance<7&&!rotated) return;

  if(!rotated){
    rotated=true;

    try{
      wheel.setPointerCapture(event.pointerId);
    }catch{}
  }

  const angle=wheelAngle(event);

  let delta=angle-lastAngle;

  if(delta>180) delta-=360;
  if(delta< -180) delta+=360;

  accumulated+=delta;
  lastAngle=angle;

  while(Math.abs(accumulated)>=15){
    const direction=accumulated>0?1:-1;

    if(view==="now"&&
      Number.isFinite(audio.duration)&&
      audio.duration>0){

      seeking=true;

      scrubPosition=Math.max(
        0,Math.min(
          audio.duration,
          scrubPosition+direction*5
        )
      );

      if($("progress")){
        $("progress").value=
          scrubPosition/audio.duration*100;

        $("elapsed").textContent=
          formatTime(scrubPosition);

        $("remaining").textContent=
          "-"+formatTime(
            audio.duration-scrubPosition
          );
      }

      feedback();

    }else{
      move(direction);
    }

    accumulated-=direction*15;
  }
});

function finishWheel(event){
  if(event.pointerId!==activePointer) return;

  if(rotated){
    suppressUntil=performance.now()+180;

    if(seeking&&view==="now"&&
      Number.isFinite(audio.duration)){

      audio.currentTime=scrubPosition;
    }
  }

  activePointer=null;
  accumulated=0;
  rotated=false;
  seeking=false;
}

window.addEventListener("pointerup",finishWheel);
window.addEventListener("pointercancel",finishWheel);

wheel.addEventListener("click",event=>{
  if(performance.now()<suppressUntil){
    event.preventDefault();
    event.stopImmediatePropagation();
  }
},true);

/* =====================================
   KEYBOARD CONTROLS
===================================== */

document.addEventListener("keydown",event=>{
  if(["INPUT","TEXTAREA","SELECT","BUTTON"]
    .includes(document.activeElement?.tagName)){
    return;
  }

  switch(event.key){
    case "ArrowDown":
      event.preventDefault();
      move(1);
      break;

    case "ArrowUp":
      event.preventDefault();
      move(-1);
      break;

    case "ArrowRight":
      next();
      break;

    case "ArrowLeft":
      previous();
      break;

    case "Enter":
      selectItem();
      break;

    case "Escape":
      back();
      break;

    case " ":
      event.preventDefault();
      togglePlay();
      break;
  }
});
